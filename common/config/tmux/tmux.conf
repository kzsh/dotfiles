# Prefix
unbind C-b
set -g prefix C-f
bind C-f send-prefix

set -g mouse on
set -sg escape-time 0

# Split windows like vim (vim's h/v is reversed from tmux's)
bind s split-window -v -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'

# Window navigation
bind h select-window -t :-
bind l select-window -t :+

# Pane navigation, Vim-aware: forward C-hjkl to Vim when it owns the pane.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# Resize panes like vim
bind < resize-pane -L 10
bind > resize-pane -R 10
bind - resize-pane -D 10
bind + resize-pane -U 10

# Copy mode (vi)
setw -g mode-keys vi
bind Escape copy-mode
# copy-selection ends the selection but stays in copy-mode/scrollback
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Paste / buffers
bind p paste-buffer
bind C-d delete-buffer
bind d detach-client
bind C-p run "tmux set-buffer \"$(xclip -o)\"; tmux paste-buffer"

# Misc
bind C-l send-keys 'C-l'          # clear screen under prefix
bind : command-prompt
bind R respawn-window
bind r source-file ~/.config/tmux/tmux.conf \; display 'reloaded'
unbind t
bind-key t next-window

set -g default-terminal "screen-256color"
set-option -g history-limit 100000
set-option -g default-shell /bin/bash

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1

# Status
set -g window-status-current-style bg=colour166,fg=colour255
set-window-option -g automatic-rename on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
run '~/.config/tmux/plugins/tpm/tpm'
